version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: caresync_postgres
    restart: always
    environment:
      POSTGRES_USER: caresync_user
      POSTGRES_PASSWORD: caresync_password
      POSTGRES_DB: caresync_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caresync_user -d caresync_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: caresync_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://caresync_user:caresync_password@db:5432/caresync_db
      - ALLOWED_ORIGINS=*
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
