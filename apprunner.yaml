version: 1.0
runtime: python310
build:
  commands:
    build:
      - pip install -r requirements.txt
run:
  command: uvicorn app.main:app --host 0.0.0.0 --port 8080
  network:
    port: 8080
    env: PORT
  env:
    - name: APP_ENV
      value: production
    - name: ALLOWED_ORIGINS
      value: "*"
